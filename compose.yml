services:
  visualizer:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "${VISUALIZER_PORT:-8080}:80"

  sequence_server:
    profiles: [sequence_server]
    build:
      context: ./test
      dockerfile: Dockerfile
    ports:
      - "${SEQUENCE_SERVER_PORT:-8003}:8003"
    volumes:
      - ${SEQUENCE_FILE}:/data/sequence.json:ro
      - ${HARDWARE_FILE}:/data/hardware.json:ro
    command: >
      python sequence_server.py
      --file /data/sequence.json
      --hardware-file /data/hardware.json
      --visualizer-port ${VISUALIZER_PORT:-8080}
      --server-port ${SEQUENCE_SERVER_PORT:-8003}
